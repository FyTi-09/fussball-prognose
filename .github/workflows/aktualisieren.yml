# Rechnet die Prognosen automatisch neu und veröffentlicht die Seite über GitHub Pages.
name: Prognosen aktualisieren

on:
  schedule:
    - cron: "0 5 * * *"        # täglich 06:00 (Winterzeit) bzw. 07:00 (Sommerzeit)
    - cron: "0 22 * * 5,6,0,1"  # Fr–Mo abends 23:00 (Winterzeit) nach den Spielen
    - cron: "0 17 * * 5"        # Fr 18:00 (Winterzeit): Quoten fürs Freitagsspiel holen, bevor es angepfiffen wird
  push:                       # neue Version von Seite oder Programm sofort veröffentlichen
    branches: [main]
    paths: ["site/**", "prognose/**", "run.py", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      backtest:
        description: "Rückwärtstest erzwingen"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prognosen
  cancel-in-progress: false

jobs:
  rechnen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Rechenlogik prüfen (Kicktipp-Regel, Wahrscheinlichkeiten, Seite = Python).
      # Schlägt ein Test fehl, wird nichts berechnet und nichts veröffentlicht.
      - name: Tests
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Prognosen berechnen
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ inputs.backtest }}" = "true" ]; then
            python run.py --backtest
          else
            python run.py
          fi

      - name: Archiv und KI-Daten sichern
        run: |
          git config user.name "prognose-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Daten aktualisiert $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase -X theirs
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Eigener Job: Das Seitenpaket ist erst nach Ende des Rechen-Jobs sicher abrufbar.
  veroeffentlichen:
    needs: rechnen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
